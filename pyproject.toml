[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polypbench"
version = "0.1.0"
description = "Native detector adapters and reproducible COCO evaluation"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "pycocotools>=2.0.7,<3", "Pillow>=10"]

[project.optional-dependencies]
data = ["opencv-python-headless>=4.8"]

[project.scripts]
polypbench = "polypbench.cli:main"

[tool.setuptools.packages.find]
include = ["polypbench*"]
